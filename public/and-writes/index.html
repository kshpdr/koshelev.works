<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog · koshelev.works</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            padding: 24px;
            padding-bottom: 120px;
        }

        main {
            max-width: 440px;
        }

        header {
            margin-bottom: 24px;
            font-size: 15px;
        }

        header a {
            color: #999;
            text-decoration: none;
        }

        header a:hover {
            color: #000;
        }

        .title {
            font-weight: 500;
            color: #000;
        }

        .sep {
            color: #ccc;
            margin: 0 8px;
        }

        .depth-counter {
            font-size: 11px;
            color: #ccc;
            font-family: monospace;
            max-height: 0;
            overflow: hidden;
            margin-bottom: 0;
            opacity: 0;
        }

        .depth-counter.visible {
            opacity: 1;
            max-height: 2em;
            margin-bottom: 8px;
        }

        .back {
            display: block;
            margin-bottom: 48px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #000;
        }

        p {
            color: #444;
            margin-bottom: 24px;
        }

        .muted {
            color: #999;
        }

        a {
            color: inherit;
        }

        .post {
            margin-bottom: 16px;
        }

        .post-title {
            font-weight: 500;
            color: #000;
            text-decoration: none;
        }

        .post-title:hover {
            text-decoration: underline;
        }

        .post-date {
            color: #999;
            margin-left: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main>
        <div class="depth-counter" id="depthCounter"></div>
        <header>
            <a href="/">koshelev.works</a>
            <span class="sep">/</span>
            <span class="title">and-writes</span>
        </header>

        <div class="post">
            <a href="/and-writes/keeping-things-up-to-date" class="post-title">Keep things up to date</a>
            <span class="post-date">February 1, 2026</span>
        </div>

        <div class="post">
            <a href="/and-writes/sharing-on-the-internet" class="post-title">Sharing on the Internet</a>
            <span class="post-date">January 31, 2026</span>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const depth = parseInt(params.get('d') || '0');
        if (depth > 0) {
            const counter = document.getElementById('depthCounter');
            counter.textContent = `depth ${depth}`;
            counter.classList.add('visible');
            document.querySelectorAll('header a').forEach(a => {
                const url = new URL(a.href, window.location.origin);
                url.searchParams.set('d', depth);
                a.href = url.toString();
            });
        }
    </script>
</body>
</html>
